<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, interactive-widget=resizes-content"
    />
    <meta name="theme-color" content="#160a13" />
    <link rel="icon" type="image/jpeg" href="/logo-website-192.jpg" />
    <link rel="apple-touch-icon" href="/logo-website-192.jpg" />
    <meta name="description" content="声优情报站：日本女声优主题小游戏合集。声优猜、你是哪个声优、声优问答、猜歌、喜欢或讨厌，免登录即可开玩。" />
    <script>
      try {
        var storedUiTheme = localStorage.getItem('ui-theme');
        if (localStorage.getItem('ui-motion') === 'off') {
          document.documentElement.dataset.motion = 'reduced';
        }
        var initTheme =
          storedUiTheme === 'light'
            ? 'light'
            : storedUiTheme === 'blast'
              ? 'blast'
              : window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches
                ? 'light'
                : 'blast';
        document.documentElement.dataset.theme = initTheme;
        document.documentElement.style.colorScheme = initTheme === 'blast' ? 'dark' : 'light';
        document.documentElement.style.background = initTheme === 'blast' ? '#160a13' : '#f3f0ea';
        var themeColorMeta = document.querySelector('meta[name="theme-color"]');
        if (themeColorMeta) themeColorMeta.content = initTheme === 'blast' ? '#160a13' : '#f3f0ea';
        document.documentElement.dataset.themeReady = '';
      } catch (_) {
        document.documentElement.dataset.theme = 'blast';
        document.documentElement.style.background = '#160a13';
        document.documentElement.dataset.themeReady = '';
      }
    </script>
    <title>声优情报站 - 日本女声优主题小游戏合集</title>
  </head>
  <body>
    <noscript>需要启用 JavaScript 才能运行本应用。/ JavaScript is required to run this app.</noscript>
    <div id="root"></div>
    <link rel="stylesheet" href="/src/styles/index.css" />
    <link rel="stylesheet" href="/src/styles/themes/blast-foundation.css" media="not all" data-blast-theme />
    <link rel="stylesheet" href="/src/styles/themes/blast-pages.css" media="not all" data-blast-theme />
    <link rel="stylesheet" href="/src/styles/themes/blast-responsive.css" media="not all" data-blast-theme />
    <script>
      try {
        var isLightTheme = document.documentElement.dataset.theme === 'light';
        var blastSheets = document.querySelectorAll('link[data-blast-theme]');
        for (var i = 0; i < blastSheets.length; i += 1) {
          if (isLightTheme) {
            var preload = document.createElement('link');
            preload.rel = 'preload';
            preload.as = 'style';
            preload.href = blastSheets[i].href;
            document.head.appendChild(preload);
          } else {
            blastSheets[i].media = 'all';
          }
        }
      } catch (_) {}
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
